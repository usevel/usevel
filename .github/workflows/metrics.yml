# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: usevel
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Yekaterinburg
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%

      - uses: actions/checkout@v4

      - name: Build stats.json
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          U=usevel
          commits=$(gh api "search/commits?q=author:$U" --jq .total_count)
          prs=$(gh api "search/issues?q=author:$U+type:pr" --jq .total_count)
          issues=$(gh api "search/issues?q=author:$U+type:issue+state:open" --jq .total_count)
          releases=0
          for r in $(gh api "users/$U/repos?per_page=100" --jq '.[].name'); do
            n=$(gh api "repos/$U/$r/releases" --jq length)
            releases=$((releases + n))
          done
          echo "{\"commits\":$commits,\"prs\":$prs,\"issues\":$issues,\"releases\":$releases}" > stats.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats.json
          git commit -m "update stats.json" || true
          git pull --rebase origin main
          git push